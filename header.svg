<svg width="900" height="80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="leftClip">
      <rect x="0" y="0" width="450" height="80">
        <animate attributeName="x" from="450" to="0" dur="2s" fill="freeze" />
      </rect>
    </clipPath>
    <clipPath id="rightClip">
      <rect x="450" y="0" width="450" height="80">
        <animate attributeName="width" from="0" to="450" dur="2s" fill="freeze" />
      </rect>
    </clipPath>
  </defs>

  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="middle" font-family="Fira Code, monospace" font-size="36" font-weight="bold">
    <tspan fill="#FF0080" clip-path="url(#leftClip)">BunnyBlood /</tspan>
    <tspan fill="#00D4FF" clip-path="url(#rightClip)"> Frontend developer</tspan>
  </text>
</svg>
